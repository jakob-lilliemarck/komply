path = "src/services/*/repositories/*"

[[rules]]
id = "repo.data-methods"
statement = "Every public method on a repository struct, other than a constructor, returns repository model data or a typed error."
enabled = true

[[rules]]
id = "repo.data-method-names"
statement = "A repository's public methods other than constructors are named with data-access verbs such as `search`, `get`, `load`, `store`, `archive`, `collect`, or `evaluate`."
enabled = true

[[rules]]
id = "repo.batch-operations"
statement = "A repository returns several items in one collection or model."
enabled = true

[[rules]]
id = "repo.facade"
statement = "A repository separates its public API from its internal helper functions."
enabled = true

[[rules]]
id = "repo.explicit-inputs"
statement = "A repository method other than a constructor receives the data it works on as arguments."
enabled = true

[[rules]]
id = "repo.self-contained"
statement = "A repository has no `use crate::services::...` line."
enabled = true

[[rules]]
id = "repo.model-encapsulation"
statement = "A repository model's fields are `pub(super)` and its accessors are `pub`."
enabled = true

[[rules]]
id = "repo.typed-errors"
statement = "A repository defines its own `Error` enum with `thiserror`."
enabled = true
