# Template. This project has no Postgres repository yet.
# Enable these rules when one exists, and narrow `path` to that repository.

path = "src/services/*/repositories/*"

[[rules]]
id = "postgres.one-aggregate"
statement = "A repository manages one aggregate: one cohesive set of tables that share one identity."
enabled = false

[[rules]]
id = "postgres.aggregate-boundary"
statement = "A repository's joins and foreign keys stay inside its own aggregate."
enabled = false

[[rules]]
id = "postgres.read-write-split"
statement = "A repository separates reads from writes: `Read` is public, `Write` and `WriteTx` are private to the service, and `Write` is used only for standalone writes."
enabled = false

[[rules]]
id = "postgres.query-per-file"
statement = "Each query function lives in its own file under `queries/`, named `{verb}_{entity}`."
enabled = false

[[rules]]
id = "postgres.store-batches"
statement = "A store takes a batch of entities and inserts them together."
enabled = false

[[rules]]
id = "postgres.filter-naming"
statement = "A search filter is named `{Entity}Filter` and lives in its search file."
enabled = false

[[rules]]
id = "postgres.providers"
statement = "Each repository struct has one provider function in `registrations.rs`."
enabled = false

[[rules]]
id = "postgres.no-validation"
statement = "A repository trusts its inputs; validation happens at the boundary."
enabled = false

[[rules]]
id = "postgres.transaction-timestamp"
statement = "A transactional write receives one timestamp as an argument and passes it through."
enabled = false

[[rules]]
id = "postgres.append-only"
statement = "A mutation appends a new row with a new timestamp, so the stored history is immutable."
enabled = false

[[rules]]
id = "postgres.search-latest"
statement = "A search returns the latest row for each id."
enabled = false

[[rules]]
id = "postgres.model-domain-only"
statement = "A repository model carries only the fields callers use; `timestamp` and `archived` stay in the queries."
enabled = false

[[rules]]
id = "postgres.schema"
statement = "Each aggregate has one base table and no database view."
enabled = false
