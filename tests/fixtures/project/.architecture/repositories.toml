path = "src/services/*/repositories/*"

[files]
include = ["**/*"]
exclude = ["target/**", "**/*.lock"]

[[rules]]
id = "repo.facade"
statement = "A repository separates its public API from its internal helper functions."
enabled = true

[[rules]]
id = "repo.typed-queries"
statement = "Queries are statically checked with `sqlx::query_as!` or `sqlx::query!`."
enabled = false
