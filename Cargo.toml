[package]
name = "komply"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "comply"
path = "src/bin/cli.rs"

[lib]
name = "komply"
path = "src/lib.rs"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"
globset = "0.4"
ureq = { version = "2", features = ["json", "tls"] }

[dev-dependencies]
tempfile = "3"
